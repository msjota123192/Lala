name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}   # permite clicar em "Run workflow" manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

            - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceptar licencias de Android SDK
        run: yes | sdkmanager --licenses

      - name: Dar permissão de execução ao gradlew
        run: chmod +x ./gradlew

      - name: Build do APK (debug)
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload do APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: mouse-to-touch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
